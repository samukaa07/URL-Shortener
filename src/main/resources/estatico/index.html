<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Encurtador de URL - Topaz</title>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f5f7;
        display: flex;
        justify-content: center;
        padding-top: 60px;
    }
    .caixa {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        padding: 32px;
        width: 420px;
    }
    h1 {
        font-size: 20px;
        margin-top: 0;
        text-align: center;
    }
    label {
        display: block;
        margin-top: 16px;
        font-size: 13px;
        color: #444;
    }
    input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        margin-top: 4px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        background: #9a7909;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }
    button:hover {
        background: #9a7909;
    }
    #resultado {
        margin-top: 20px;
        padding: 12px;
        background: #f0f4ff;
        border-radius: 4px;
        display: none;
        word-break: break-all;
    }
    #resultado a {
        color: #03040b;
        font-weight: bold;
    }
    #copiar {
        margin-top: 10px;
        background: #008016;
    }
    #erro {
        margin-top: 16px;
        color: #b00020;
        font-size: 13px;
        display: none;
    }
</style>
</head>
<body>
<div class="caixa">
    <h1>Encurtador de URL</h1>

    <label for="url">URL original</label>
    <input id="url" type="text" placeholder="https://www.google.com">

    <label for="alias">Alias (opcional)</label>
    <input id="alias" type="text" placeholder="google">

    <button id="encurtar">Encurtar</button>

    <div id="erro"></div>

    <div id="resultado">
        URL encurtada:<br>
        <a id="link" href="#" target="_blank"></a>
        <button id="copiar">Copiar</button>
    </div>
</div>

<script>
document.getElementById('encurtar').addEventListener('click', function () {
    var url = document.getElementById('url').value.trim();
    var alias = document.getElementById('alias').value.trim();
    var erroDiv = document.getElementById('erro');
    var resultadoDiv = document.getElementById('resultado');

    erroDiv.style.display = 'none';
    resultadoDiv.style.display = 'none';

    var corpo = { url: url };
    if (alias) {
        corpo.alias = alias;
    }

    fetch('api/urls', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo)
    }).then(function (resposta) {
        return resposta.json().then(function (dados) {
            return { status: resposta.status, dados: dados };
        });
    }).then(function (resultado) {
        if (resultado.status === 201) {
            var link = document.getElementById('link');
            link.href = resultado.dados.shortUrl;
            link.textContent = resultado.dados.shortUrl;
            resultadoDiv.style.display = 'block';
        } else {
            erroDiv.textContent = resultado.dados.mensagem || 'Nao foi possivel encurtar a URL.';
            erroDiv.style.display = 'block';
        }
    }).catch(function () {
        erroDiv.textContent = 'Erro ao falar com o servidor.';
        erroDiv.style.display = 'block';
    });
});

document.getElementById('copiar').addEventListener('click', function () {
    var link = document.getElementById('link').textContent;
    navigator.clipboard.writeText(link);
});
</script>
</body>
</html>
